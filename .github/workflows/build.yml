name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk flux-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flux-tv-apk
          path: flux-tv.apk

      - name: Publier la dernière version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Flux TV (dernière version)
          body: "Version ${{ github.run_number }}. Télécharge flux-tv.apk ci-dessous."
          make_latest: true
          files: flux-tv.apk
